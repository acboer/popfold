<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Popfold — arte do instalador (lateral)</title>
<!-- Arte lateral do assistente de instalação (Inno Setup: WizardImageFile, 164×314 a 100%). -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 164px; height: 314px; overflow: hidden; }
  .art { position: relative; width: 164px; height: 314px; background: #B79CFF; overflow: hidden; font-family: 'Fredoka', sans-serif; }
  .candy { position: absolute; border-radius: 50%; }
  .candy::after { content: ""; position: absolute; left: 22%; top: 18%; width: 34%; height: 22%; border-radius: 50%; background: rgba(255,255,255,0.55); }
  .icon { position: absolute; left: 32px; top: 70px; width: 100px; height: 100px; }
  .word { position: absolute; left: 0; right: 0; top: 196px; text-align: center; font-weight: 700; font-size: 36px; letter-spacing: -0.5px; line-height: 1; }
  .word .pop { color: #FF7AB6; } .word .fold { color: #2B1B4A; }
  .tag { position: absolute; left: 0; right: 0; top: 238px; text-align: center; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 12px; color: #2B1B4A; }
  .shelf { position: absolute; left: -20px; right: -20px; top: 184px; height: 160px; background: #FFF4F8; border-radius: 50% 50% 0 0 / 28px 28px 0 0; }
</style>
</head>
<body>
<div class="art">
  <div class="candy" style="left: -18px; top: -14px; width: 70px; height: 70px; background: #FF7AB6"></div>
  <div class="candy" style="left: 118px; top: 18px; width: 34px; height: 34px; background: #7FE3C4"></div>
  <div class="candy" style="left: 132px; top: 126px; width: 52px; height: 52px; background: #FFE27A"></div>
  <div class="candy" style="left: 8px; top: 146px; width: 22px; height: 22px; background: #FFFFFF"></div>
  <div class="candy" style="left: 70px; top: 30px; width: 14px; height: 14px; background: #FFE27A"></div>

  <svg class="icon" viewBox="0 0 200 200" role="img" aria-label="Ícone do Popfold">
    <rect x="10" y="10" width="180" height="180" rx="56" fill="#FFFFFF" opacity="0.35"></rect>
    <rect x="16" y="16" width="168" height="168" rx="52" fill="#B79CFF" stroke="#FFFFFF" stroke-width="6"></rect>
    <circle cx="72" cy="80" r="27" fill="#FF7AB6"></circle>
    <circle cx="130" cy="72" r="27" fill="#7FE3C4"></circle>
    <circle cx="70" cy="134" r="27" fill="#FFE27A"></circle>
    <circle cx="128" cy="130" r="27" fill="#FFFFFF"></circle>
    <ellipse cx="63" cy="70" rx="9" ry="6" fill="#FFFFFF" opacity="0.55"></ellipse>
    <ellipse cx="121" cy="62" rx="9" ry="6" fill="#FFFFFF" opacity="0.55"></ellipse>
    <ellipse cx="61" cy="124" rx="9" ry="6" fill="#FFFFFF" opacity="0.6"></ellipse>
    <path d="M160 28 l8 -12 M172 44 l14 -4 M150 22 l-2 -14" stroke="#2B1B4A" stroke-width="7" stroke-linecap="round"></path>
  </svg>

  <div class="shelf"></div>
  <div class="word"><span class="pop">pop</span><span class="fold">fold</span></div>
  <div class="tag">Seus apps, num pop.</div>
  <div class="candy" style="left: 22px; top: 272px; width: 26px; height: 26px; background: #FF7AB6"></div>
  <div class="candy" style="left: 56px; top: 280px; width: 18px; height: 18px; background: #7FE3C4"></div>
  <div class="candy" style="left: 98px; top: 268px; width: 30px; height: 30px; background: #B79CFF"></div>
  <div class="candy" style="left: 136px; top: 282px; width: 16px; height: 16px; background: #FFE27A"></div>
</div>
</body>
</html>
