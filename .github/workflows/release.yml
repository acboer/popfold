# Builds the Popfold installer on GitHub's servers and publishes it.
#
# - Push a tag like v0.3.1 → builds, attests and publishes a release with the installer.
#   (The tag must match <Version> in Popfold.csproj.)
# - Run it manually (Actions → Release → Run workflow) → just builds; the installer is
#   attached to the run as an artifact.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write       # create the release
  id-token: write       # sign the build provenance attestation
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Popfold.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match <Version>$version</Version> in Popfold.csproj"
          }

      - name: Install Inno Setup (if the runner doesn't have it)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: ./tools/build-installer.ps1

      - name: Installer info
        id: info
        shell: pwsh
        run: |
          $f = Get-ChildItem dist -Filter 'Popfold-Setup-*.exe' | Select-Object -First 1
          $sha = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "path=$($f.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($f.Name)" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "$sha  $($f.Name)" | Tee-Object -FilePath dist/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/Popfold-Setup-*.exe

      - name: Upload installer to the run
        uses: actions/upload-artifact@v5
        with:
          name: popfold-installer
          path: |
            dist/Popfold-Setup-*.exe
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $notes = "docs/release-notes-$version.md"
          $body = if (Test-Path $notes) { Get-Content $notes -Raw } else { "Popfold $version" }
          $body += @"

          ---

          ### Verify the download
          Built by GitHub Actions from this repository ([build log]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID)).

          SHA256: ``${{ steps.info.outputs.sha256 }}``

          With the [GitHub CLI](https://cli.github.com): ``gh attestation verify ${{ steps.info.outputs.name }} --repo $env:GITHUB_REPOSITORY``
          "@
          Set-Content release-body.md $body -Encoding utf8
          gh release create $tag "${{ steps.info.outputs.path }}" dist/SHA256SUMS.txt --title "Popfold $version" --notes-file release-body.md --latest
